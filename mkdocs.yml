site_name: psxsplash Documentation
site_description: Make PlayStation 1 games with psxsplash, the editor, engine and emulator in one download
site_url: https://psxsplash.github.io/docs/
repo_url: https://github.com/psxsplash
repo_name: psxsplash on GitHub

validation:
  links:
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tabs
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  version:
    provider: mike
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/psxsplash

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Your First Project: getting-started/first-project.md
    - Play, Hardware and Discs: getting-started/play-and-export.md
  - The Editor:
    - editor/index.md
    - Objects & Components: editor/objects.md
    - Importing Models & Textures: editor/importing.md
    - Materials & Bit Depth: editor/materials.md
    - Lighting: editor/lighting.md
    - The Lua Editor: editor/lua-editor.md
    - The Block Editor: editor/block-editor.md
    - UI Canvases: editor/ui-canvas.md
    - Sprite Sheets: editor/sprites.md
    - Tilemaps: editor/tilemaps.md
    - Prefabs: editor/prefabs.md
    - Cutscenes & Animations: editor/timeline.md
    - Skinned Animation: editor/skinned-animation.md
    - Player, Navigation & Rooms: editor/navigation-rooms.md
    - Agents (NPCs): editor/agents.md
    - Audio: editor/audio.md
    - Scene Settings: editor/scene-settings.md
    - World Streaming: editor/world-streaming.md
    - Building & Running: editor/building.md
  - Scripting:
    - lua/index.md
    - Fixed-Point Math: lua/fixed-point.md
    - Event Callbacks: lua/events.md
    - API Reference: lua/api-reference.md
    - Patterns: lua/patterns.md
  - Tutorials:
    - tutorials/index.md
    - Collectible Pickups: tutorials/collectibles.md
    - Animated Doors: tutorials/animated-doors.md
    - Scene Transitions: tutorials/scene-transitions.md
    - Health & Damage: tutorials/health-damage.md
  - Reference:
    - reference/index.md
    - Memory & Performance: reference/memory.md
    - Known Issues: reference/known-issues.md
    - Glossary: reference/glossary.md
    - Contributing: reference/contributing.md
    - Changelog: reference/changelog.md
  - Legacy (Unity) docs: https://psxsplash.github.io/docs/unity/
